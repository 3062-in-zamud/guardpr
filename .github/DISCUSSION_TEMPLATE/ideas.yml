title: "[Idea]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Share your ideas for new features, scanner improvements, or workflow enhancements.

  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: Describe your idea
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why would this be useful? What problem does it solve?
    validations:
      required: false
