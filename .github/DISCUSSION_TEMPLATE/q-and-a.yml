title: "[Q&A]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Ask questions about GuardPR setup, configuration, scanner behavior, or integration with your CI/CD pipeline.

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What would you like to know?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Any relevant context (e.g., your setup, what you've tried)
    validations:
      required: false
