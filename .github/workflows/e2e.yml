name: E2E Tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "action.yml"
      - ".github/workflows/e2e.yml"
      - "test/e2e/**"
      - "test/fixtures/**"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "action.yml"
      - ".github/workflows/e2e.yml"
      - "test/e2e/**"
      - "test/fixtures/**"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"
      - run: npm ci
      - run: npm run test:e2e
