name: Precision Gate

on:
  push:
    branches: [main]
    paths:
      - "src/scoring/**"
      - "src/scanners/**"
      - "test/precision/**"
  pull_request:
    branches: [main]
    paths:
      - "src/scoring/**"
      - "src/scanners/**"
      - "test/precision/**"

permissions:
  contents: read

jobs:
  precision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"
      - run: npm ci
      - run: npm run test:precision
